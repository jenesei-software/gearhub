name: Release

# Manual release: bumps the version, tags the commit, builds the self-contained
# single-file executable, wraps it into an Inno Setup installer and publishes
# everything on the GitHub Releases page.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Bump version
        shell: pwsh
        run: |
          $path = 'Directory.Build.props'
          $text = Get-Content -Raw $path
          $match = [regex]::Match($text, '<Version>([0-9]+\.[0-9]+\.[0-9]+)</Version>')
          if (-not $match.Success) { throw 'Version is not found in Directory.Build.props' }

          $current = [version]$match.Groups[1].Value
          switch ('${{ inputs.bump }}') {
            'major' { $new = "$($current.Major + 1).0.0" }
            'minor' { $new = "$($current.Major).$($current.Minor + 1).0" }
            default { $new = "$($current.Major).$($current.Minor).$($current.Build + 1)" }
          }

          $text = $text -replace '<Version>[0-9]+\.[0-9]+\.[0-9]+</Version>', "<Version>$new</Version>"
          Set-Content -Path $path -Value $text -NoNewline -Encoding utf8
          "VERSION=$new" >> $env:GITHUB_ENV
          "New version: $new"

      - name: Commit and tag
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Directory.Build.props
          git commit -m "chore: release v$env:VERSION"
          git tag "v$env:VERSION"
          git push origin "HEAD:$env:GITHUB_REF_NAME"
          git push origin "v$env:VERSION"

      - name: Test
        run: dotnet test GearHub.slnx -c Release

      - name: Publish self-contained executable
        run: >
          dotnet publish src/GearHub.App/GearHub.App.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none -o publish

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=$env:VERSION installer\GearHub.iss'

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: GearHub v${{ env.VERSION }}
          generate_release_notes: true
          files: Output/GearHub-Setup-*.exe
